<main class="review-shell">
  <header class="review-header"><span>{{Module}}</span><span class="position">{{ID}}</span></header>
  <div class="topic">{{Topic}}</div>
  <section class="prompt compact">{{Prompt}}</section>
  {{#FrontCode}}{{FrontCode}}{{/FrontCode}}
  <div class="divider"><span>Answer</span></div>
  <section class="answer">{{Answer}}</section>
  {{#BackCode}}<div class="code-title">The matching Lean step</div>{{BackCode}}{{/BackCode}}
  <aside class="memory"><span class="memory-label">Remember</span>{{Takeaway}}</aside>
  <details class="source"><summary>Find this step in the walkthrough</summary><p>{{Source}}</p></details>
</main>
