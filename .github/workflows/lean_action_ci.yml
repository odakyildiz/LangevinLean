name: Lean and exposition

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "true"
      - name: Audit ULA theorem dependencies
        run: lake env lean UnadjustedLangevin/Check.lean
      - name: Audit IPLA theorem dependencies
        run: lake env lean IPLA/Check.lean
      - name: Check ULA exposition against source
        run: python3 UnadjustedLangevin/exposition/verify_document.py
      - name: Check IPLA exposition and isolated standalone compilation
        run: python3 IPLA/verify.py
