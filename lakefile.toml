name = "LangevinLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GradientDescent", "UnadjustedLangevin", "ConvexityTutorial", "IPLA"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "GradientDescent"

[[lean_lib]]
name = "UnadjustedLangevin"

[[lean_lib]]
name = "ConvexityTutorial"

[[lean_lib]]
name = "IPLA"
