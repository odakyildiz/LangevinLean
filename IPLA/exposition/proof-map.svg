<title id="proof-map-title">Proof of the general-dimension IPLA theorem</title>
<desc id="proof-map-description">Fourteen linked boxes trace the joint assumptions through IPLA geometry, the shared ULA theorem and Gibbs stationarity, and marginal concentration. These branches meet in projection and exact scaling, then the final theorem. Every box links its Lean source.</desc>
